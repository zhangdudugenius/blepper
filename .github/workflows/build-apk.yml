name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android build tools
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare an offline native app shell
        env:
          BLEPPER_APK_KEYSTORE_PASSWORD: ${{ secrets.BLEPPER_APK_KEYSTORE_PASSWORD }}
          BLEPPER_APK_KEY_PASSWORD: ${{ secrets.BLEPPER_APK_KEY_PASSWORD }}
        run: |
          mkdir -p native-shell/www
          cp index.html app.js styles.css custom.css manifest.webmanifest sw.js native-shell/www/
          cp -R assets native-shell/www/assets
          echo "${{ secrets.BLEPPER_APK_KEYSTORE_BASE64 }}" | base64 --decode > native-shell/android.keystore
          cd native-shell
          cat > package.json <<'EOF'
          {
            "name": "blepper-lifestyle-android",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/core": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.0.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.blepper.lifestyle",
            "appName": "blepper lifestyle",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          EOF
          npm install --no-audit --no-fund
          npx cap add android
          npx cap copy android
          cp android.keystore android/app/blepper.keystore
          cat >> android/app/build.gradle <<'EOF'

          android {
            signingConfigs {
              release {
                storeFile file("blepper.keystore")
                storePassword System.getenv("BLEPPER_APK_KEYSTORE_PASSWORD")
                keyAlias "blepper"
                keyPassword System.getenv("BLEPPER_APK_KEY_PASSWORD")
                storeType "PKCS12"
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          EOF
          for density in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android/app/src/main/res/$density"
            cp "www/assets/cat-launcher-icon.png" "android/app/src/main/res/$density/ic_launcher.png"
            cp "www/assets/cat-launcher-icon.png" "android/app/src/main/res/$density/ic_launcher_round.png"
          done

      - name: Build signed APK
        env:
          BLEPPER_APK_KEYSTORE_PASSWORD: ${{ secrets.BLEPPER_APK_KEYSTORE_PASSWORD }}
          BLEPPER_APK_KEY_PASSWORD: ${{ secrets.BLEPPER_APK_KEY_PASSWORD }}
        run: cd native-shell/android && ./gradlew assembleRelease --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: blepper-lifestyle-android-apk
          path: native-shell/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
